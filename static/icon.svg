		<rect x="62" y="40" width="68" height="14" rx="4"/>
		<rect x="124" y="48" width="14" height="44" rx="4"/>
		<rect x="124" y="100" width="14" height="44" rx="4"/>
		<rect x="54" y="48" width="14" height="44" rx="4"/>
		<rect x="62" y="89" width="68" height="14" rx="4"/>
	</g>
	<rect x="62" y="138" width="68" height="14" rx="4" fill="#82ffaf" opacity="0.28"/>
</svg>
